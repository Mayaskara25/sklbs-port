<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mayaskara Bhat — Portfolio</title>
<meta name="description" content="Mayaskara Bhat — Computer Science @ RVCE. Startup operations, AI automation and business development.">
<meta name="theme-color" content="#03030f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#6ff2ff; --violet:#a78bfa; --pink:#ff7ad9; --gold:#ffd97a;
  --bg0:#03030f; --ink:#e8ecff; --muted:#8b93c9; --line:rgba(140,160,255,.18);
  --glass:rgba(10,12,38,.62); --ease:cubic-bezier(.2,.8,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg0);font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

canvas#space{position:fixed;inset:0;z-index:0;touch-action:none;cursor:grab}
canvas#space.pointer{cursor:pointer}
canvas#space.grabbing{cursor:grabbing}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:10;transition:opacity .4s,transform .5s var(--ease)}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}

#topbar{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;pointer-events:none}
#topbar>*{pointer-events:auto}
.brand{font-family:'Orbitron';font-weight:900;letter-spacing:3px;font-size:15px;cursor:pointer;
  background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:'Space Grotesk';font-weight:400;letter-spacing:4px;font-size:9px;margin-top:2px;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.tools{display:flex;gap:8px}
.tbtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:12px;font-size:12.5px;color:#c7cdf5;text-decoration:none;transition:.25s}
.tbtn:hover{color:#fff;border-color:rgba(111,242,255,.5);box-shadow:0 0 18px rgba(111,242,255,.15)}
.tbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtn kbd{font-family:inherit;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.tbtn.primary{color:#03111f;background:linear-gradient(90deg,var(--cyan),var(--violet));border:none;font-weight:600}
.tbtn.primary:hover{color:#03111f;box-shadow:0 0 22px rgba(120,200,255,.45)}

#nav{bottom:22px;left:50%;transition:left .6s var(--ease),opacity .4s;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:18px}
.navbtn{display:flex;align-items:center;gap:7px;font-family:'Orbitron';font-size:10.5px;letter-spacing:1.8px;color:#aeb6ff;
  padding:9px 14px;border-radius:13px;transition:color .25s,background .25s,box-shadow .25s;white-space:nowrap}
.navbtn i{font-style:normal;font-family:'Space Grotesk';font-size:10px;color:#6a72a6;letter-spacing:0}
.navbtn:hover{color:#fff;background:rgba(120,140,255,.1)}
.navbtn.active{color:#03111f;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 18px rgba(120,200,255,.4)}
.navbtn.active i{color:#1b2550}
.navarrow{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#aeb6ff;font-size:18px;transition:.25s}
.navarrow:hover{color:#fff;background:rgba(120,140,255,.12)}
.navsep{width:1px;height:22px;background:var(--line);margin:0 2px}

#hint{bottom:84px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:1.5px;color:#8a92c4;white-space:nowrap;
  padding:7px 14px;border-radius:20px;pointer-events:none}
#hint b{color:#cfd5ff;font-weight:500}
#hint.gone{opacity:0}

#mapdock{left:22px;bottom:22px;padding:8px;border-radius:16px;display:flex;flex-direction:column;gap:6px}
#minimap{width:176px;height:124px;display:block;border-radius:10px;cursor:pointer;background:rgba(3,4,18,.6)}
.zoomrow{display:flex;gap:6px}
.zoomrow button{flex:1;height:30px;border-radius:9px;border:1px solid var(--line);color:#aeb6ff;font-size:15px;transition:.2s}
.zoomrow button:hover{color:#fff;border-color:rgba(111,242,255,.5)}
#zoomlvl{flex:1.3;display:grid;place-items:center;font-size:10.5px;color:var(--muted);letter-spacing:1px;font-variant-numeric:tabular-nums}

#rail{top:50%;right:22px;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
#rail a,#rail button{color:#8f9adf;transition:.25s;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:rgba(10,12,36,.5);backdrop-filter:blur(8px)}
#rail a:hover,#rail button:hover{color:#fff;border-color:var(--cyan);box-shadow:0 0 16px rgba(110,240,255,.4);transform:scale(1.08)}
#rail svg{width:17px;height:17px;fill:currentColor}
@media(min-width:761px){body.panel-open #nav{left:calc((100vw - min(500px,100vw - 24px) - 12px)/2)}body.panel-open #hint,body.panel-open #mapdock{opacity:0;pointer-events:none}}
body.panel-open #rail{opacity:0;pointer-events:none}

#tip{position:fixed;z-index:15;pointer-events:none;padding:8px 12px;border-radius:10px;font-size:12px;opacity:0;transform:translateY(4px);
  transition:opacity .15s,transform .15s;max-width:260px}
#tip.show{opacity:1;transform:none}
#tip b{display:block;color:#fff;font-weight:500;font-size:13px}
#tip span{color:var(--muted);font-size:11px}

/* ---------- Panel (drawer) ---------- */
#panel{position:fixed;z-index:20;top:12px;right:12px;bottom:12px;width:min(500px,calc(100vw - 24px));display:flex;flex-direction:column;
  transform:translateX(calc(100% + 30px));transition:transform .6s var(--ease);
  background:linear-gradient(160deg,rgba(14,16,48,.9),rgba(6,8,28,.94));border:1px solid rgba(140,160,255,.22);border-radius:22px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 80px rgba(0,0,0,.5),0 0 60px rgba(80,120,255,.18)}
#panel.open{transform:none}
#pscroll{flex:1;overflow-y:auto;padding:34px 32px 24px;outline:none;overscroll-behavior:contain}
#pscroll::-webkit-scrollbar,#rbody::-webkit-scrollbar{width:6px}
#pscroll::-webkit-scrollbar-thumb,#rbody::-webkit-scrollbar-thumb{background:#3a427a;border-radius:4px}
#close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;color:var(--muted);font-size:18px;transition:.3s;z-index:2}
#close:hover{color:var(--pink);transform:rotate(90deg);background:rgba(255,122,217,.08)}
#pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
#pfoot button{display:flex;align-items:center;gap:6px;font-size:12px;color:#aeb6ff;padding:8px 12px;border-radius:10px;transition:.2s;max-width:44%}
#pfoot button:hover{color:#fff;background:rgba(120,140,255,.1)}
#pfoot span{font-family:'Orbitron';font-size:10px;letter-spacing:2px;color:#6a72a6}

.ptag{font-family:'Orbitron';font-size:10px;letter-spacing:4px;color:var(--cyan);text-transform:uppercase;margin-bottom:10px}
.ptitle{font-family:'Orbitron';font-size:clamp(22px,4vw,30px);font-weight:700;line-height:1.15;margin-bottom:6px;
  background:linear-gradient(90deg,#fff,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.psub{color:#9aa3d8;font-size:14px;margin-bottom:20px;letter-spacing:.3px}
.pbody{font-size:14.5px;line-height:1.75;color:#c9d0f5}
.pbody p+p{margin-top:10px}
.pbody h3{font-family:'Orbitron';font-size:10.5px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin:24px 0 10px}
.pbody ul{list-style:none}
.pbody li{position:relative;padding-left:18px;margin:7px 0}
.pbody li::before{content:'';position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px var(--violet)}
.pbody a{color:var(--cyan);text-decoration:none}
.block{padding:16px 18px;margin:10px 0;border-radius:14px;background:rgba(30,36,80,.3);border:1px solid rgba(120,140,255,.14);transition:box-shadow .4s}
.block b{color:#fff;font-size:14.5px;font-weight:600}
.block .org{color:var(--pink);font-size:11.5px;margin:3px 0 8px;letter-spacing:1px;text-transform:uppercase}
.block p,.block li{color:#b8c0e8;font-size:13.3px;line-height:1.7}
.hl{animation:hl 2.4s ease}
@keyframes hl{0%,45%{box-shadow:0 0 0 1.5px var(--cyan),0 0 34px rgba(110,240,255,.3)}100%{box-shadow:0 0 0 0 transparent}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 20px}
.stats div{padding:14px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(30,36,80,.28);text-align:center}
.stats b{display:block;font-family:'Orbitron';font-size:22px;color:#fff}
.stats span{font-size:10.5px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:11.5px;letter-spacing:.5px;padding:5px 12px;border-radius:20px;border:1px solid rgba(167,139,250,.35);color:#c4b5fd;background:rgba(124,100,250,.08)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.filters button{font-size:11px;letter-spacing:1px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:#aeb6ff;transition:.2s}
.filters button:hover{color:#fff}
.filters button.on{color:#03111f;background:var(--cyan);border-color:var(--cyan)}
.filters button em{font-style:normal;opacity:.6;margin-left:4px}

.repo{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 16px;margin:8px 0;border-radius:14px;
  border:1px solid rgba(120,140,255,.16);background:rgba(30,36,80,.32);transition:.25s;text-decoration:none;color:inherit;width:100%;text-align:left}
.repo:hover{border-color:var(--cyan);background:rgba(40,50,110,.5);transform:translateX(4px);box-shadow:0 0 20px rgba(110,240,255,.12)}
.repo b{color:#fff;font-size:14px;font-weight:500}.repo span{color:#8f98cc;font-size:12px}
.repo .lang{font-size:10px;letter-spacing:1px;color:var(--gold);white-space:nowrap;display:flex;align-items:center;gap:6px}
.repo .lang::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.repo[hidden]{display:none}

.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.big-cta,.ghost-cta{display:inline-flex;align-items:center;gap:8px;font-family:'Orbitron';font-size:11px;letter-spacing:2px;padding:12px 22px;border-radius:30px;text-decoration:none;transition:.25s}
.big-cta{color:#03111f;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 24px rgba(120,200,255,.35)}
.big-cta:hover{transform:translateY(-2px);box-shadow:0 0 36px rgba(120,200,255,.6)}
.ghost-cta{color:#cfd5ff;border:1px solid rgba(140,160,255,.35)}
.ghost-cta:hover{color:#fff;border-color:var(--cyan);transform:translateY(-2px)}
.copyrow{display:flex;gap:8px;align-items:center}
.copyrow .repo{flex:1}
.mini-btn{flex:none;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);font-size:12px;color:#aeb6ff;transition:.2s}
.mini-btn:hover{color:#fff;border-color:var(--cyan)}

/* ---------- Command palette ---------- */
#palette{position:fixed;inset:0;z-index:40;background:rgba(2,2,12,.55);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
#palette[hidden]{display:none}
.pal{width:min(600px,100%);border-radius:18px;overflow:hidden;background:linear-gradient(160deg,rgba(16,18,52,.97),rgba(8,10,30,.97));border:1px solid rgba(140,160,255,.28);box-shadow:0 30px 90px rgba(0,0,0,.6);animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.pal input{width:100%;padding:18px 20px;background:none;border:none;border-bottom:1px solid var(--line);color:#fff;font:inherit;font-size:16px;outline:none}
.pal input::placeholder{color:#6a72a6}
#palList{max-height:min(52vh,420px);overflow-y:auto;padding:6px}
.pitem{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:11px;text-align:left}
.pitem.sel{background:rgba(111,242,255,.1);box-shadow:inset 0 0 0 1px rgba(111,242,255,.3)}
.pitem .pt{flex:1;min-width:0}
.pitem b{display:block;color:#fff;font-weight:500;font-size:14px}
.pitem span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem em{font-style:normal;font-size:10px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.pempty{padding:24px;text-align:center;color:var(--muted);font-size:13px}
.palfoot{padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:#6a72a6;letter-spacing:.5px}

/* ---------- Reader ---------- */
#reader{position:fixed;inset:0;z-index:30;background:radial-gradient(1200px 600px at 70% -10%,rgba(80,70,200,.25),transparent),var(--bg0);display:flex;flex-direction:column;animation:fade .35s ease}
#reader[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.rbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line)}
.rnav{display:flex;gap:4px;flex-wrap:wrap}
.rnav a{font-size:12px;color:#aeb6ff;text-decoration:none;padding:6px 10px;border-radius:9px}
.rnav a:hover{color:#fff;background:rgba(120,140,255,.1)}
#rbody{flex:1;overflow-y:auto;padding:30px 20px 80px;scroll-behavior:smooth}
.rsec{max-width:760px;margin:0 auto 26px;padding:34px 36px;border-radius:22px;border:1px solid var(--line);background:rgba(12,14,40,.6)}

#toast{position:fixed;z-index:50;left:50%;top:22px;transform:translate(-50%,-20px);opacity:0;padding:10px 18px;border-radius:12px;font-size:13px;transition:.35s var(--ease);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

#loader{position:fixed;inset:0;z-index:99;background:var(--bg0);display:grid;place-items:center;transition:opacity .9s}
#loader div{font-family:'Orbitron';letter-spacing:6px;color:var(--cyan);animation:pulse 1.4s infinite;font-size:13px}
@keyframes pulse{50%{opacity:.35}}

@media(max-width:1100px){#rail{display:none}}
@media(max-width:760px){
  #topbar{padding:12px 14px}
  .tbtn .lbl,.tbtn kbd{display:none}
  .tbtn{padding:0 11px}
  #mapdock{display:none}
  #nav{bottom:14px;bottom:max(14px,env(safe-area-inset-bottom))}
  .navbtn:not(.active),.navsep{display:none}
  .navbtn.active{min-width:150px;justify-content:center}
  #hint{bottom:74px;font-size:10px}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:64vh;transform:translateY(calc(100% + 20px))}
  #pscroll{padding:28px 20px 20px}
  body.panel-open #nav{opacity:0;pointer-events:none}
  .rsec{padding:26px 20px}
  .rnav{display:none}
  .stats b{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>

let W,H,DPR,bgGrad;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bgGrad=ctx.createLinearGradient(0,0,0,H);

}

const ZMIN=.28,ZMAX=2.2;
const cam={x:0,y:500,z:.3,vx:0,vy:0};
let current="home",flight=null,t=0;
const view={ox:0,oy:0};          // eased screen offset so the planet stays visible beside the panel
function viewCenter(){return[(W-view.ox)/2,(H-view.oy)/2+(view.oy>0?24:0)];}
function toScreen(x,y){const[cx,cy]=viewCenter();return[(x-cam.x)*cam.z+cx,(y-cam.y)*cam.z+cy];}
function toWorld(x,y){const[cx,cy]=viewCenter();return[(x-cx)/cam.z+cam.x,(y-cy)/cam.z+cam.y];}

function panelSize(){const p=$("#panel");return isDesktop()?p.offsetWidth+12:p.offsetHeight+8;}
function fitZoom(id,withPanel){
  const e=SECTORS[id].ext;let aw=W-80,ah=H-200;
  if(withPanel){if(isDesktop())aw-=panelSize();else ah=H-panelSize()-90;}
  return clamp(Math.min(aw/(e*2),ah/(e*1.24+90)),ZMIN,1.25);
}

/* cinematic flight: eased path + zoom-out arc proportional to distance */
function flyToPoint(x,y,z,opts={}){
  const dist=Math.hypot(x-cam.x,y-cam.y);
  flight={x0:cam.x,y0:cam.y,z0:cam.z,x1:x,y1:y,z1:clamp(z,ZMIN,ZMAX),t0:performance.now(),
    d:RM?1:(opts.d||clamp(650+dist*.42,550,2000)),arc:RM?0:clamp(dist/5200,0,.48),then:opts.then,fired:false};
  cam.vx=cam.vy=0;
}
function cancelFlight(){if(flight){flight=null;}}

function flyTo(id,opts={}){
  const s=SECTORS[id];
  const willOpen=!!(opts.open||opts.then);
  if(!willOpen&&panelOpen)closePanel();
  setCurrent(id);
  const then=opts.then||(opts.open?()=>showSector(id,opts.k):null);
  const z=fitZoom(id,willOpen);
  // already there → just do the thing
  if(Math.hypot(s.x-cam.x,s.y-cam.y)<20&&Math.abs(cam.z-z)<.03&&!flight){then&&then();return;}
  flyToPoint(s.x,s.y,z,{then});
}
const stepSector=dir=>flyTo(TOUR[mod(TOUR.indexOf(current)+dir,TOUR.length)],{open:panelOpen});
function zoomAt(px,py,f){
  cancelFlight();
  const[wx,wy]=toWorld(px,py);cam.z=clamp(cam.z*f,ZMIN,ZMAX);
  const[cx,cy]=viewCenter();cam.x=wx-(px-cx)/cam.z;cam.y=wy-(py-cy)/cam.z;
}
const zoomBy=f=>flyToPoint(cam.x,cam.y,cam.z*f,{d:320});

const glowCache=new Map();
function glow(h,s=100,l=68){
  const key=h+"/"+s+"/"+l;let c=glowCache.get(key);if(c)return c;
  c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d");
  const rg=g.createRadialGradient(64,64,0,64,64,64);
  rg.addColorStop(0,`hsla(${h},${s}%,${Math.min(95,l+20)}%,1)`);rg.addColorStop(.22,`hsla(${h},${s}%,${l}%,.42)`);
  rg.addColorStop(.6,`hsla(${h},${s}%,${l}%,.08)`);rg.addColorStop(1,`hsla(${h},${s}%,${l}%,0)`);
  g.fillStyle=rg;g.fillRect(0,0,128,128);glowCache.set(key,c);return c;
}
function nebulaSprite(h){
  const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");
  g.globalCompositeOperation="lighter";
  for(let i=0;i<9;i++){
    const x=256+(rand()-.5)*240,y=256+(rand()-.5)*240,r=90+rand()*150,hh=h+(rand()-.5)*50;
    const rg=g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`hsla(${hh},85%,55%,.045)`);rg.addColorStop(1,`hsla(${hh},90%,55%,0)`);
    g.fillStyle=rg;g.fillRect(0,0,512,512);
  }
  return c;
}
const nebulae=[[-900,-1300,1500,262],[1700,-700,1700,210],[1300,1500,1500,325],[-1900,700,1600,40],[100,2300,1400,165],[0,200,1300,200]]
  .map(([x,y,r,h])=>({x,y,r,img:nebulaSprite(h)}));

const LAYERS=[{n:420,f:.06,r:[.3,.9]},{n:240,f:.16,r:[.5,1.3]},{n:90,f:.34,r:[.9,2]}];
const stars=[];
LAYERS.forEach((L,l)=>{for(let i=0;i<L.n;i++){const c=rand();stars.push({u:rand(),v:rand(),l,r:lerp(L.r[0],L.r[1],rand()),
  tw:rand()*6.28,ts:.6+rand()*2,c:c<.08?"255,217,122":c<.16?"127,240,255":c<.22?"255,160,220":"215,222,255"});}});

const ptrs=new Map();let drag=null,pinch=null,mouse=null,hover=null,interacted=false;
function firstInteraction(){if(!interacted){interacted=true;$("#hint").classList.add("gone");}}

cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,lt:performance.now(),moved:false,vx:0,vy:0,type:e.pointerType};
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};if(drag)drag.moved=true;}
});
cv.addEventListener("pointermove",e=>{
  if(e.pointerType==="mouse")mouse={x:e.clientX,y:e.clientY};
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    zoomAt(mx,my,d/pinch.d);cam.x-=(mx-pinch.mx)/cam.z;cam.y-=(my-pinch.my)/cam.z;pinch={d,mx,my};firstInteraction();return;
  }
  if(!drag)return;
  const now=performance.now(),dx=e.clientX-drag.lx,dy=e.clientY-drag.ly;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6){drag.moved=true;cancelFlight();cv.classList.add("grabbing");firstInteraction();}
  if(drag.moved){
    cam.x-=dx/cam.z;cam.y-=dy/cam.z;cam.vx=cam.vy=0;
    const s=Math.max(.008,(now-drag.lt)/1000);
    drag.vx=lerp(drag.vx,-dx/cam.z/s,.35);drag.vy=lerp(drag.vy,-dy/cam.z/s,.35);
  }
  drag.lx=e.clientX;drag.ly=e.clientY;drag.lt=now;
});
function endPtr(e,cancel){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===1){const p=[...ptrs.values()][0];drag={sx:p.x,sy:p.y,lx:p.x,ly:p.y,lt:performance.now(),moved:true,vx:0,vy:0};return;}
  if(ptrs.size===0&&drag){
    if(drag.moved){
      if(performance.now()-drag.lt<90){const max=3200/cam.z;cam.vx=clamp(drag.vx,-max,max);cam.vy=clamp(drag.vy,-max,max);} // fling
    }else if(!cancel)handleClick(e.clientX,e.clientY);
    drag=null;cv.classList.remove("grabbing");
  }
}
cv.addEventListener("pointerup",e=>endPtr(e,false));
cv.addEventListener("pointercancel",e=>endPtr(e,true));
cv.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"){mouse=null;setHover(null);}});

/* wheel: scroll = travel between sectors · ctrl/⌘/shift/pinch = zoom */
let wheelAcc=0,wheelLock=0;
cv.addEventListener("wheel",e=>{
  e.preventDefault();firstInteraction();
  const unit=e.deltaMode===1?16:e.deltaMode===2?H:1,dy=(e.deltaY||e.deltaX)*unit;
  if(e.ctrlKey||e.metaKey||e.shiftKey){zoomAt(e.clientX,e.clientY,Math.exp(-dy*(e.ctrlKey?.01:.0018)));return;}
  const now=performance.now();
  if(now<wheelLock){wheelAcc=0;return;}
  wheelAcc+=dy;
  if(Math.abs(wheelAcc)>60){stepSector(Math.sign(wheelAcc));wheelAcc=0;wheelLock=now+(RM?300:950);}
},{passive:false});

const keys={};
const THRUST={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==="k"){e.preventDefault();paletteOpen?closePalette():openPalette();return;}
  if(k==="escape"){if(paletteOpen)closePalette();else if(!$("#reader").hidden)closeReader();else if(panelOpen)closePanel();return;}
  if(paletteOpen||!$("#reader").hidden||e.target.matches("input,textarea")||e.ctrlKey||e.metaKey||e.altKey)return;
  if(k==="/"){e.preventDefault();openPalette();return;}
  if(/^[1-6]$/.test(k)){flyTo(TOUR[+k-1],{open:panelOpen});return;}
  if(k==="n"||k==="]"||k==="pagedown"){e.preventDefault();stepSector(1);return;}
  if(k==="p"||k==="["||k==="pageup"){e.preventDefault();stepSector(-1);return;}
  if(k==="+"||k==="="){zoomBy(1.35);return;}
  if(k==="-"||k==="_"){zoomBy(1/1.35);return;}
  if(k==="0"){flyTo(current,{open:panelOpen});return;}
  if((k==="enter"||k===" ")&&e.target===document.body&&!panelOpen){e.preventDefault();flyTo(current,{open:true});return;}
  if(THRUST[k]&&!panelOpen){e.preventDefault();keys[k]=true;cancelFlight();firstInteraction();}
});
addEventListener("keyup",e=>{delete keys[e.key.toLowerCase()];});
addEventListener("blur",()=>{for(const k in keys)delete keys[k];});

/* picking */
function pick(px,py){
  let best=null,bd=1e9;
  for(const m of allMoons){if(!m.vis)continue;const d=Math.hypot(px-m.sx,py-m.sy);if(d<Math.max(16,12*cam.z)&&d<bd){bd=d;best={type:"moon",m};}}
  if(best)return best;
  for(const id of TOUR){const s=SECTORS[id],[sx,sy]=toScreen(s.x,s.y);if(Math.hypot(px-sx,py-sy)<s.R*cam.z+14)return{type:"planet",id};}
  return null;
}
function setHover(h){
  hover=h;const tip=$("#tip");
  cv.classList.toggle("pointer",!!h);
  if(!h||!mouse){tip.classList.remove("show");return;}
  if(h.type==="moon"){tip.innerHTML=`<b>${h.m.label}</b><span>${h.m.hint}</span>`;}
  else{const s=SECTORS[h.id];tip.innerHTML=`<b>${s.name}</b><span>${s.sub} · click to open</span>`;}
  tip.style.left=Math.min(mouse.x+16,W-tip.offsetWidth-10)+"px";tip.style.top=(mouse.y+18)+"px";tip.classList.add("show");
}
function handleClick(px,py){
  firstInteraction();
  const h=pick(px,py);
  if(!h){if(panelOpen)closePanel();return;}
  if(h.type==="planet")flyTo(h.id,{open:true});
  else activateMoon(h.m);
}
function activateMoon(m){
  if(m.href){if(m.href.startsWith("http"))window.open(m.href,"_blank","noopener");else location.href=m.href;}
  else if(m.action)m.action();
  else if(m.repo!=null)openRepo(m.repo);
  else openSector(m.sid,m.k);
}

/* =====================================================================
   UPDATE + RENDER
   ===================================================================== */
let last=performance.now(),prevCam={x:cam.x,y:cam.y},orbitSpeed=1,settleTimer=0;

function update(dt,now){
  // panel offset easing
  const target=panelOpen?panelSize():0,ef=1-Math.exp(-9*dt);
  if(isDesktop()){view.ox+= (target-view.ox)*ef;view.oy+=(0-view.oy)*ef;}else{view.oy+=(target-view.oy)*ef;view.ox+=(0-view.ox)*ef;}

  if(flight){
    const p=clamp((now-flight.t0)/flight.d,0,1),e=easeIO(p);
    cam.x=lerp(flight.x0,flight.x1,e);cam.y=lerp(flight.y0,flight.y1,e);
    cam.z=lerp(flight.z0,flight.z1,e)*(1-flight.arc*Math.sin(Math.PI*e));
    if(!flight.fired&&p>.55){flight.fired=true;flight.then&&flight.then();}
    if(p>=1)flight=null;
  }else{
    let ax=0,ay=0;for(const k in keys){const v=THRUST[k];if(v){ax+=v[0];ay+=v[1];}}
    if(ax||ay){const n=Math.hypot(ax,ay),acc=3400/cam.z;cam.vx+=ax/n*acc*dt;cam.vy+=ay/n*acc*dt;}
    if(!drag){
      const max=2600/cam.z,sp=Math.hypot(cam.vx,cam.vy);if(sp>max){cam.vx*=max/sp;cam.vy*=max/sp;}
      cam.x+=cam.vx*dt;cam.y+=cam.vy*dt;
      const fr=Math.exp(-(ax||ay?2.2:3.4)*dt);cam.vx*=fr;cam.vy*=fr;
      // soft world bounds
      const bx=2600,by0=-1900,by1=2900;
      if(cam.x<-bx)cam.vx+=(-bx-cam.x)*6*dt;if(cam.x>bx)cam.vx+=(bx-cam.x)*6*dt;
      if(cam.y<by0)cam.vy+=(by0-cam.y)*6*dt;if(cam.y>by1)cam.vy+=(by1-cam.y)*6*dt;
    }
    // while drifting, the nearest planet becomes the current sector
    if((settleTimer+=dt)>.25){settleTimer=0;
      let bid=null,bd=1e9;for(const id of TOUR){const s=SECTORS[id],d=Math.hypot(s.x-cam.x,s.y-cam.y);if(d<bd){bd=d;bid=id;}}
      if(bd<650&&bid!==current)setCurrent(bid);
    }
  }
  // moons slow down under the cursor so they're easy to click
  orbitSpeed=lerp(orbitSpeed,hover?.12:1,1-Math.exp(-6*dt));
  for(const m of allMoons)m.a+=m.w*dt*orbitSpeed;
  $("#zoomlvl").textContent=Math.round(cam.z*100)+"%";
}

function render(dt){
  ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
  const[cx,cy]=viewCenter();
  const cvx=(cam.x-prevCam.x)/Math.max(dt,.001),cvy=(cam.y-prevCam.y)/Math.max(dt,.001);
  prevCam={x:cam.x,y:cam.y};

  /* nebulae (parallax) */
  ctx.globalCompositeOperation="lighter";
  const zn=Math.sqrt(cam.z);
  for(const n of nebulae){
    const f=.5,sx=cx+(n.x-cam.x)*f*zn,sy=cy+(n.y-cam.y)*f*zn,r=n.r*zn;
    if(sx+r<0||sx-r>W||sy+r<0||sy-r>H)continue;
    ctx.globalAlpha=.9;ctx.drawImage(n.img,sx-r,sy-r,r*2,r*2);
  }

  /* stars with warp streaks when moving fast */
  const Wr=W+200,Hr=H+200,zs=.75+.25*cam.z;
  ctx.lineCap="round";
  for(const s of stars){
    const L=LAYERS[s.l],px=mod(s.u*Wr-cam.x*L.f*zs,Wr)-100,py=mod(s.v*Hr-cam.y*L.f*zs,Hr)-100;
    const tw=.55+.45*Math.sin(t*s.ts+s.tw),a=(.25+.75*tw)*(.45+s.l*.28),r=s.r*(.85+.15*cam.z);
    const lx=RM?0:clamp(-cvx*L.f*zs*.05,-160,160),ly=RM?0:clamp(-cvy*L.f*zs*.05,-160,160);
    if(Math.abs(lx)+Math.abs(ly)>2.5){
      ctx.strokeStyle=`rgba(${s.c},${a})`;ctx.lineWidth=r*1.3;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+lx,py+ly);ctx.stroke();
    }else if(r<1){ctx.fillStyle=`rgba(${s.c},${a})`;ctx.fillRect(px,py,r*1.6,r*1.6);}
    else{ctx.fillStyle=`rgba(${s.c},${a})`;ctx.beginPath();ctx.arc(px,py,r,0,6.283);ctx.fill();
      if(r>1.5){ctx.globalAlpha=a*.5;ctx.drawImage(glow(220,60,80),px-r*5,py-r*5,r*10,r*10);ctx.globalAlpha=1;}}
  }

  /* meteors */
  for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];
    m.x+=m.vx*dt;m.y+=m.vy*dt;m.life-=dt*1.1;if(m.life<=0){meteors.splice(i,1);continue;}
    const g=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*.12,m.y-m.vy*.12);
    g.addColorStop(0,`rgba(200,240,255,${m.life})`);g.addColorStop(1,"rgba(200,240,255,0)");
    ctx.strokeStyle=g;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*.12,m.y-m.vy*.12);ctx.stroke();
  }

  /* travel route between sectors */
  ctx.globalCompositeOperation="source-over";
  ctx.setLineDash([3,11]);ctx.lineDashOffset=-t*18;ctx.lineWidth=1.2;ctx.strokeStyle="rgba(150,170,255,.2)";
  ctx.beginPath();
  TOUR.forEach((id,i)=>{const s=SECTORS[id],[x,y]=toScreen(s.x,s.y);
    if(!i){ctx.moveTo(x,y);return;}
    const p=SECTORS[TOUR[i-1]],[px,py]=toScreen(p.x,p.y),mx=(x+px)/2-(y-py)*.18,my=(y+py)/2+(x-px)*.18;
    ctx.quadraticCurveTo(mx,my,x,y);});
  ctx.stroke();ctx.setLineDash([]);

  /* planets + moons (moons behind the planet drawn first for depth) */
  const labels=[],titles=[];
  for(const id of TOUR){
    const s=SECTORS[id],[sx,sy]=toScreen(s.x,s.y),r=s.R*cam.z,reach=s.ext*cam.z+60;
    const moons=MOONS[id];
    if(sx<-reach||sx>W+reach||sy<-reach||sy>H+reach){moons.forEach(m=>m.vis=false);continue;}
    const active=id===current,hov=hover&&hover.type==="planet"&&hover.id===id;

    // orbit paths
    const rings=new Set(moons.map(m=>m.r));
    ctx.lineWidth=1;
    for(const rr of rings){ctx.strokeStyle=`hsla(${s.hue},80%,75%,${active?.16:.08})`;ctx.beginPath();ctx.ellipse(sx,sy,rr*cam.z,rr*cam.z*.62,0,0,6.283);ctx.stroke();}

    for(const m of moons){m.sx=sx+Math.cos(m.a)*m.r*cam.z;m.sy=sy+Math.sin(m.a)*m.r*cam.z*.62;m.vis=true;}
    moons.filter(m=>Math.sin(m.a)<0).forEach(m=>drawMoon(m,s,labels));
    drawPlanet(s,sx,sy,r,active,hov);
    moons.filter(m=>Math.sin(m.a)>=0).forEach(m=>drawMoon(m,s,labels));

    titles.push({s,id,sx,sy:sy-s.outer*cam.z*.62-8});
  }

  /* moon labels on top */
  ctx.textAlign="center";setFont("500 11px 'Space Grotesk'","0.5px");
  for(const L of labels){
    const w=ctx.measureText(L.text).width+16,x=L.x,y=L.y-L.off;
    ctx.globalAlpha=L.a;
    ctx.fillStyle=L.hot?"rgba(111,242,255,.18)":"rgba(8,10,30,.62)";
    roundRect(x-w/2,y-11,w,20,10);ctx.fill();
    ctx.strokeStyle=L.hot?"rgba(111,242,255,.7)":`hsla(${L.hue},80%,75%,.22)`;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=L.hot?"#fff":"rgba(215,222,255,.9)";ctx.fillText(L.text,x,y+3.5);
  }
  /* planet titles above everything, sitting just above the planet */
  const la=clamp((cam.z-.25)*3,0,1);
  if(la>0){
    ctx.textAlign="center";ctx.shadowColor="rgba(0,0,10,.9)";ctx.shadowBlur=10;
    for(const{s,id,sx,sy}of titles){
      ctx.globalAlpha=la;
      setFont("700 "+(id==="home"?15:14)+"px Orbitron","4px");
      ctx.fillStyle=`hsl(${s.hue},95%,90%)`;ctx.fillText(s.title,sx,sy-36);
      setFont("400 11.5px 'Space Grotesk'","1px");
      ctx.fillStyle="rgba(190,198,240,.85)";ctx.fillText(s.sub,sx,sy-18);
    }
    ctx.shadowBlur=0;ctx.shadowColor="transparent";
  }
  ctx.globalAlpha=1;
}

function drawPlanet(s,sx,sy,r,active,hov){
  const h=s.hue;
  ctx.globalCompositeOperation="lighter";
  ctx.globalAlpha=active?.42:.28;ctx.drawImage(glow(h,90,60),sx-r*3.6,sy-r*3.6,r*7.2,r*7.2);ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";
  const tilt=-.32;
  if(s.ring)drawRing(sx,sy,r,h,tilt,Math.PI,2*Math.PI);
  // body
  const g=ctx.createRadialGradient(sx-r*.4,sy-r*.45,r*.08,sx,sy,r*1.05);
  g.addColorStop(0,`hsl(${h},95%,88%)`);g.addColorStop(.45,`hsl(${h},70%,52%)`);g.addColorStop(1,`hsl(${h+25},60%,9%)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,r,0,6.283);ctx.fill();
  if(s.bands){
    ctx.save();ctx.beginPath();ctx.arc(sx,sy,r,0,6.283);ctx.clip();
    for(let k=-2;k<=2;k++){ctx.fillStyle=`hsla(${h+k*8},90%,${k%2?80:30}%,.09)`;
      ctx.beginPath();ctx.ellipse(sx+Math.sin(t*.3+k)*r*.08,sy+k*r*.36,r*1.3,r*.11,.08,0,6.283);ctx.fill();}
    ctx.restore();
  }
  // atmosphere rim
  ctx.strokeStyle=`hsla(${h},100%,82%,.55)`;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(sx,sy,r+.5,0,6.283);ctx.stroke();
  if(s.ring)drawRing(sx,sy,r,h,tilt,0,Math.PI);
  // selection ring
  if(active||hov){
    ctx.setLineDash([4,7]);ctx.lineDashOffset=-t*14;ctx.lineWidth=1.3;
    ctx.strokeStyle=`hsla(${h},100%,80%,${hov?.9:.45})`;ctx.beginPath();ctx.arc(sx,sy,r+12+Math.sin(t*2)*1.5,0,6.283);ctx.stroke();ctx.setLineDash([]);
  }
}
function drawRing(sx,sy,r,h,tilt,a0,a1){
  for(const[k,a,w]of[[2.05,.5,3],[1.75,.3,6],[1.5,.18,2]]){
    ctx.strokeStyle=`hsla(${h},70%,80%,${a})`;ctx.lineWidth=w*cam.z;
    ctx.beginPath();ctx.ellipse(sx,sy,r*k,r*k*.26,tilt,a0,a1);ctx.stroke();
  }
}
function drawMoon(m,s,labels){
  const hot=hover&&hover.type==="moon"&&hover.m===m;
  const depth=.75+.25*Math.sin(m.a); // front moons are bigger/brighter
  const sz=m.size*Math.sqrt(cam.z)*depth*(hot?1.5:1),h=s.hue+(m.repo!=null?(m.repo*9)%40-20:0);
  ctx.globalCompositeOperation="lighter";
  ctx.globalAlpha=(hot?.7:.35)*depth;ctx.drawImage(glow(h),m.sx-sz*5,m.sy-sz*5,sz*10,sz*10);
  ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;
  ctx.fillStyle=`hsl(${h},90%,${hot?92:78}%)`;ctx.beginPath();ctx.arc(m.sx,m.sy,sz,0,6.283);ctx.fill();
  if(cam.z>.5||hot)labels.push({text:m.label,x:m.sx,y:m.sy,off:sz+16,a:hot?1:clamp((cam.z-.5)*4,0,1)*(.55+.45*depth),hot,hue:s.hue});
}
function setFont(f,ls){ctx.font=f;if("letterSpacing"in ctx)ctx.letterSpacing=ls;}
function roundRect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}

/* minimap */
const mm=$("#minimap"),mctx=mm.getContext("2d");
const MB={x0:-2100,y0:-1400,x1:2100,y1:2350};
function mmScale(){const w=mm.clientWidth,h=mm.clientHeight,s=Math.min(w/(MB.x1-MB.x0),h/(MB.y1-MB.y0));
  return{w,h,s,ox:(w-(MB.x1-MB.x0)*s)/2-MB.x0*s,oy:(h-(MB.y1-MB.y0)*s)/2-MB.y0*s};}
function drawMini(){
  if(!mm.offsetParent)return;
  const{w,h,s,ox,oy}=mmScale();
  if(mm.width!==w*DPR){mm.width=w*DPR;mm.height=h*DPR;}
  mctx.setTransform(DPR,0,0,DPR,0,0);mctx.clearRect(0,0,w,h);
  mctx.strokeStyle="rgba(150,170,255,.25)";mctx.setLineDash([2,3]);mctx.beginPath();
  TOUR.forEach((id,i)=>{const p=SECTORS[id];i?mctx.lineTo(p.x*s+ox,p.y*s+oy):mctx.moveTo(p.x*s+ox,p.y*s+oy);});
  mctx.stroke();mctx.setLineDash([]);
  for(const id of TOUR){const p=SECTORS[id],x=p.x*s+ox,y=p.y*s+oy,a=id===current;
    mctx.fillStyle=`hsl(${p.hue},90%,${a?80:62}%)`;mctx.beginPath();mctx.arc(x,y,a?4.5:3,0,6.283);mctx.fill();
    if(a){mctx.strokeStyle=`hsla(${p.hue},90%,80%,.6)`;mctx.beginPath();mctx.arc(x,y,8,0,6.283);mctx.stroke();}}
  const[a0,b0]=toWorld(0,0),[a1,b1]=toWorld(W-view.ox,H-view.oy);
  mctx.strokeStyle="rgba(111,242,255,.8)";mctx.lineWidth=1;
  mctx.strokeRect(a0*s+ox,b0*s+oy,(a1-a0)*s,(b1-b0)*s);
}
mm.addEventListener("click",e=>{
  const{s,ox,oy}=mmScale(),r=mm.getBoundingClientRect(),wx=(e.clientX-r.left-ox)/s,wy=(e.clientY-r.top-oy)/s;
  let bid=null,bd=1e9;for(const id of TOUR){const p=SECTORS[id],d=Math.hypot(p.x-wx,p.y-wy);if(d<bd){bd=d;bid=id;}}
  firstInteraction();
  if(bd<450)flyTo(bid,{open:panelOpen});else{if(panelOpen)closePanel();flyToPoint(wx,wy,cam.z);}
});

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  update(dt,now);
  if(mouse&&!drag)setHover(pick(mouse.x,mouse.y));
  render(dt);drawMini();
  requestAnimationFrame(frame);
}

    :`<div class="pempty">Nothing found in this galaxy.</div>`;
  const sel=$("#palList .sel");sel&&sel.scrollIntoView({block:"nearest"});
}
function openPalette(){paletteOpen=true;$("#palette").hidden=false;$("#palIn").value="";palSel=0;renderPal();$("#palIn").focus();firstInteraction();}
function closePalette(){paletteOpen=false;$("#palette").hidden=true;}
function runPal(i){const it=palShown[i];if(!it)return;closePalette();if(!$("#reader").hidden&&it.run!==openReader)closeReader();it.run();}
$("#palIn").addEventListener("input",()=>{palSel=0;renderPal();});
$("#palIn").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();palSel=(palSel+1)%Math.max(1,palShown.length);renderPal();}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=mod(palSel-1,Math.max(1,palShown.length));renderPal();}
  else if(e.key==="Enter"){e.preventDefault();runPal(palSel);}
});
$("#palList").addEventListener("click",e=>{const b=e.target.closest(".pitem");if(b)runPal(+b.dataset.i);});
$("#palList").addEventListener("mousemove",e=>{const b=e.target.closest(".pitem");if(b&&+b.dataset.i!==palSel){palSel=+b.dataset.i;renderPal();}});
$("#palette").addEventListener("click",e=>{if(e.target.id==="palette")closePalette();});

/* hint adapts to the device */
$("#hint").innerHTML=matchMedia("(pointer:coarse)").matches
  ?"<b>Swipe</b> to drift · <b>Pinch</b> to zoom · <b>Tap</b> a planet"
  :"<b>Scroll</b> to travel · <b>Drag</b> / <b>WASD</b> to drift · <b>Ctrl+Scroll</b> to zoom · <b>Click</b> a planet";
setTimeout(()=>$("#hint").classList.add("gone"),12000);

/* deep links (#projects etc.) */
addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(SECTORS[id]&&id!==current)flyTo(id,{open:true});});

/* =====================================================================
   BOOT
   ===================================================================== */
requestAnimationFrame(frame);
Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(()=>{
  const l=$("#loader");l.style.opacity=0;setTimeout(()=>l.remove(),900);
  const id=location.hash.slice(1);
  if(SECTORS[id]){current="";flyTo(id,{open:true});}
  else{current="";setCurrent("home");flyToPoint(0,0,fitZoom("home",false),{d:RM?1:2200});}
});
